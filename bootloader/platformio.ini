; RS485 OTA bootloader for the ATtiny1616 split-flap slave module.
;
; Bare C, no framework, no Arduino core: it must fit the 2 KB boot section
; (BOOTEND fuse = 8, application linked at 0x0800 - see the ATtiny1616_OTA
; environment in the project root's platformio.ini).  Check the reported
; flash usage after every change; it must stay below 2048 bytes, with
; headroom for fixes.
;
; Install it with tools/install.py (writes bootloader + OTA app + fuses in
; one UPDI session; EEPROM calibration is preserved).

[platformio]
default_envs = ATtiny1616_Boot

[env:ATtiny1616_Boot]
platform = atmelmegaavr
board = ATtiny1616
board_build.f_cpu = 20000000L
build_flags =
    -Wall
    -Werror
