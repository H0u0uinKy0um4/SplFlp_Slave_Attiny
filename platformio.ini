; Shared settings for every build of the slave firmware.
[env]
platform = atmelmegaavr
board = ATtiny1616
framework = arduino

platform_packages =
    platformio/framework-arduino-megaavr-megatinycore@https://github.com/SpenceKonde/megaTinyCore

board_build.f_cpu = 20000000L
board_hardware.oscillator = internal
board_hardware.bod = 1.8v
board_hardware.eesave = yes
board_hardware.updipin = updi

lib_deps =
    moononournation/GFX Library for Arduino@^1.6.9

; Direct UPDI flashing of the plain (bootloader-less) image.
[env:ATtiny1616]
upload_protocol = custom
upload_port = /dev/ttyUSB0
upload_speed = 230400

upload_flags =
    --tool
    uart
    --device
    $BOARD
    --uart
    $UPLOAD_PORT
    -b
    $UPLOAD_SPEED

upload_command = python3 ${platformio.packages_dir}/framework-arduino-megaavr-megatinycore/tools/prog.py $UPLOAD_FLAGS -f$SOURCE -a write

; OTA application image: linked at 0x0800, sitting above the RS485
; bootloader (see the bootloader/ subproject; BOOTEND fuse = 8 gives a
; 2 KB boot section).  This env is BUILD-ONLY on purpose: never flash it
; with prog.py alone, because a UPDI chip erase wipes the boot section.
; Initial install: bootloader/tools/install.py writes bootloader + this
; app + fuses in one UPDI session.  Later updates go over RS485 via the
; master's OTA flasher.
[env:ATtiny1616_OTA]
board_build.text_section_start = 0x800
